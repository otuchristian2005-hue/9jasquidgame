<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>9jaSquidGame</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #87ceeb;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* TOP UI */

        #topUI {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 20;

            padding: 12px 16px;

            background: rgba(15, 15, 20, 0.78);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;

            color: white;

            backdrop-filter: blur(8px);
        }

        #gameTitle {
            font-size: 17px;
            font-weight: bold;
        }

        #gameVersion {
            font-size: 11px;
            opacity: 0.65;
            margin-top: 3px;
        }

        /* JOYSTICK */

        #joystick {
            position: fixed;
            left: 30px;
            bottom: 35px;

            width: 120px;
            height: 120px;

            border-radius: 50%;

            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.35);

            z-index: 30;

            touch-action: none;
        }

        #joystickKnob {
            position: absolute;

            width: 55px;
            height: 55px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(255,255,255,0.75);
            border: 2px solid rgba(255,255,255,0.9);

            box-shadow: 0 5px 20px rgba(0,0,0,0.25);

            pointer-events: none;
        }

        /* JUMP */

        #jumpButton {
            position: fixed;

            right: 30px;
            bottom: 40px;

            width: 75px;
            height: 75px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.5);

            background: rgba(80, 20, 120, 0.75);

            color: white;

            font-size: 12px;
            font-weight: bold;

            z-index: 30;

            touch-action: none;

            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;
        }

        #jumpButton:active {
            transform: scale(0.92);
            background: rgba(120, 40, 170, 0.9);
        }

        /* DESKTOP CONTROLS */

        #keyboardHint {
            position: fixed;

            bottom: 15px;
            left: 50%;

            transform: translateX(-50%);

            padding: 7px 12px;

            border-radius: 8px;

            background: rgba(0,0,0,0.5);

            color: white;

            font-size: 11px;

            z-index: 20;

            opacity: 0.7;
        }

        @media (max-width: 700px) {
            #keyboardHint {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- TOP UI -->

    <div id="topUI">
        <div id="gameTitle">🇳🇬 9jaSquidGame</div>
        <div id="gameVersion">Prototype v0.3</div>
    </div>

    <!-- MOBILE JOYSTICK -->

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <!-- JUMP -->

    <div id="jumpButton">
        JUMP
    </div>

    <!-- DESKTOP HINT -->

    <div id="keyboardHint">
        WASD / Arrow Keys to move
    </div>

    <!-- THREE.JS -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

    <script>

        /* =====================================================
           SCENE
        ===================================================== */

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87ceeb);

        /* =====================================================
           CAMERA
        ===================================================== */

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 6, 10);

        /* =====================================================
           RENDERER
        ===================================================== */

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.shadowMap.enabled = true;

        document.body.appendChild(renderer.domElement);

        /* =====================================================
           LIGHTING
        ===================================================== */

        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            1.5
        );

        scene.add(ambientLight);


        const sun = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        sun.position.set(30, 50, 20);

        sun.castShadow = true;

        scene.add(sun);


        /* =====================================================
           GROUND
        ===================================================== */

        const groundGeometry =
            new THREE.PlaneGeometry(250, 250);

        const groundMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x69a83f
            });

        const ground =
            new THREE.Mesh(
                groundGeometry,
                groundMaterial
            );

        ground.rotation.x = -Math.PI / 2;

        ground.receiveShadow = true;

        scene.add(ground);


        /* =====================================================
           ROAD
        ===================================================== */

        const roadGeometry =
            new THREE.PlaneGeometry(22, 250);

        const roadMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x303030
            });

        const road =
            new THREE.Mesh(
                roadGeometry,
                roadMaterial
            );

        road.rotation.x = -Math.PI / 2;

        road.position.y = 0.01;

        scene.add(road);


        /* =====================================================
           ROAD LINES
        ===================================================== */

        const lineMaterial =
            new THREE.MeshBasicMaterial({
                color: 0xffffff
            });


        for (let z = -120; z < 120; z += 12) {

            const lineGeometry =
                new THREE.PlaneGeometry(0.5, 6);

            const line =
                new THREE.Mesh(
                    lineGeometry,
                    lineMaterial
                );

            line.rotation.x = -Math.PI / 2;

            line.position.set(
                0,
                0.03,
                z
            );

            scene.add(line);
        }


        /* =====================================================
           BUILDING FUNCTION
        ===================================================== */

        function createBuilding(
            x,
            z,
            width,
            height,
            depth,
            color
        ) {

            const geometry =
                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                );

            const material =
                new THREE.MeshStandardMaterial({
                    color: color
                });

            const building =
                new THREE.Mesh(
                    geometry,
                    material
                );

            building.position.set(
                x,
                height / 2,
                z
            );

            building.castShadow = true;
            building.receiveShadow = true;

            scene.add(building);


            /* WINDOWS */

            for (
                let floor = 1;
                floor < height / 3;
                floor++
            ) {

                for (
                    let w = -width / 2 + 1;
                    w < width / 2;
                    w += 2.5
                ) {

                    const windowGeometry =
                        new THREE.BoxGeometry(
                            0.9,
                            1,
                            0.1
                        );

                    const windowMaterial =
                        new THREE.MeshBasicMaterial({
                            color: 0x8fd3ff
                        });

                    const windowMesh =
                        new THREE.Mesh(
                            windowGeometry,
                            windowMaterial
                        );

                    windowMesh.position.set(
                        x + w,
                        floor * 3,
                        z - depth / 2 - 0.06
                    );

                    scene.add(windowMesh);
                }
            }

            return building;
        }


        /* =====================================================
           CITY BUILDINGS
        ===================================================== */

        createBuilding(
            -25,
            -25,
            12,
            10,
            15,
            0xb65f45
        );

        createBuilding(
            25,
            -40,
            15,
            14,
            18,
            0x777777
        );

        createBuilding(
            -27,
            20,
            14,
            12,
            16,
            0xd59b42
        );

        createBuilding(
            27,
            30,
            16,
            16,
            20,
            0x6e78a5
        );

        createBuilding(
            -25,
            60,
            13,
            9,
            15,
            0x9b5949
        );

        createBuilding(
            25,
            70,
            15,
            13,
            18,
            0x8a8a8a
        );


        /* =====================================================
           PLAYER
        ===================================================== */

        const player =
            new THREE.Group();

        scene.add(player);

        player.position.set(
            0,
            0,
            12
        );


        /* BODY */

        const bodyGeometry =
            new THREE.BoxGeometry(
                1.4,
                1.8,
                0.8
            );

        const bodyMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x7627d9
            });

        const body =
            new THREE.Mesh(
                bodyGeometry,
                bodyMaterial
            );

        body.position.y = 2.2;

        body.castShadow = true;

        player.add(body);


        /* HEAD */

        const headGeometry =
            new THREE.SphereGeometry(
                0.65,
                16,
                16
            );

        const headMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x9b5b35
            });

        const head =
            new THREE.Mesh(
                headGeometry,
                headMaterial
            );

        head.position.y = 3.65;

        head.castShadow = true;

        player.add(head);


        /* LEFT ARM */

        const armGeometry =
            new THREE.BoxGeometry(
                0.45,
                1.6,
                0.45
            );

        const armMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x9b5b35
            });


        const leftArm =
            new THREE.Mesh(
                armGeometry,
                armMaterial
            );

        leftArm.position.set(
            -1,
            2.2,
            0
        );

        leftArm.castShadow = true;

        player.add(leftArm);


        /* RIGHT ARM */

        const rightArm =
            new THREE.Mesh(
                armGeometry,
                armMaterial
            );

        rightArm.position.set(
            1,
            2.2,
            0
        );

        rightArm.castShadow = true;

        player.add(rightArm);


        /* LEFT LEG */

        const legGeometry =
            new THREE.BoxGeometry(
                0.5,
                1.7,
                0.55
            );

        const legMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x161616
            });


        const leftLeg =
            new THREE.Mesh(
                legGeometry,
                legMaterial
            );

        leftLeg.position.set(
            -0.45,
            0.85,
            0
        );

        leftLeg.castShadow = true;

        player.add(leftLeg);


        /* RIGHT LEG */

        const rightLeg =
            new THREE.Mesh(
                legGeometry,
                legMaterial
            );

        rightLeg.position.set(
            0.45,
            0.85,
            0
        );

        rightLeg.castShadow = true;

        player.add(rightLeg);


        /* =====================================================
           MOVEMENT
        ===================================================== */

        const keys = {};

        let joystickX = 0;
        let joystickY = 0;

        const moveSpeed = 0.16;

        let verticalVelocity = 0;

        const gravity = -0.018;

        const jumpStrength = 0.42;

        let isJumping = false;


        /* =====================================================
           KEYBOARD
        ===================================================== */

        window.addEventListener(
            "keydown",
            function(event) {

                keys[event.key.toLowerCase()] = true;

                if (
                    event.key === " " ||
                    event.key.toLowerCase() === "w"
                ) {

                    if (!isJumping) {

                        verticalVelocity =
                            jumpStrength;

                        isJumping = true;
                    }
                }
            }
        );


        window.addEventListener(
            "keyup",
            function(event) {

                keys[event.key.toLowerCase()] = false;
            }
        );


        /* =====================================================
           JOYSTICK
        ===================================================== */

        const joystick =
            document.getElementById("joystick");

        const knob =
            document.getElementById("joystickKnob");

        let joystickActive = false;


        function updateJoystick(clientX, clientY) {

            const rect =
                joystick.getBoundingClientRect();

            const centerX =
                rect.left + rect.width / 2;

            const centerY =
                rect.top + rect.height / 2;

            let dx =
                clientX - centerX;

            let dy =
                clientY - centerY;

            const maxDistance =
                rect.width / 2 - 28;

            const distance =
                Math.sqrt(
                    dx * dx + dy * dy
                );


            if (distance > maxDistance) {

                dx =
                    dx / distance * maxDistance;

                dy =
                    dy / distance * maxDistance;
            }


            knob.style.transform =
                `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;


            joystickX =
                dx / maxDistance;

            joystickY =
                dy / maxDistance;
        }


        function resetJoystick() {

            joystickActive = false;

            joystickX = 0;
            joystickY = 0;

            knob.style.transform =
                "translate(-50%, -50%)";
        }


        joystick.addEventListener(
            "pointerdown",
            function(event) {

                joystickActive = true;

                joystick.setPointerCapture(
                    event.pointerId
                );

                updateJoystick(
                    event.clientX,
                    event.clientY
                );
            }
        );


        joystick.addEventListener(
            "pointermove",
            function(event) {

                if (!joystickActive) return;

                updateJoystick(
                    event.clientX,
                    event.clientY
                );
            }
        );


        joystick.addEventListener(
            "pointerup",
            resetJoystick
        );

        joystick.addEventListener(
            "pointercancel",
            resetJoystick
        );


        /* =====================================================
           JUMP BUTTON
        ===================================================== */

        const jumpButton =
            document.getElementById("jumpButton");


        function jump() {

            if (!isJumping) {

                verticalVelocity =
                    jumpStrength;

                isJumping = true;
            }
        }


        jumpButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                jump();
            }
        );


        /* =====================================================
           CAMERA
        ===================================================== */

        const cameraOffset =
            new THREE.Vector3();

        const cameraTarget =
            new THREE.Vector3();


        function updateCamera() {

            /*
                Camera stays behind the player
                based on the direction the player
                is facing.
            */

            const distanceBehind = 8;

            const heightAbove = 5;


            const desiredX =
                player.position.x -
                Math.sin(player.rotation.y) *
                distanceBehind;


            const desiredZ =
                player.position.z -
                Math.cos(player.rotation.y) *
                distanceBehind;


            cameraOffset.set(
                desiredX,
                player.position.y + heightAbove,
                desiredZ
            );


            /* SMOOTH CAMERA */

            camera.position.lerp(
                cameraOffset,
                0.08
            );


            cameraTarget.set(
                player.position.x,
                player.position.y + 1.8,
                player.position.z
            );


            camera.lookAt(
                cameraTarget
            );
        }


        /* =====================================================
           MOVEMENT ANIMATION
        ===================================================== */

        let walkTime = 0;


        function updatePlayer() {

            let moveX = 0;
            let moveZ = 0;


            /* KEYBOARD */

            if (
                keys["a"] ||
                keys["arrowleft"]
            ) {
                moveX -= 1;
            }

            if (
                keys["d"] ||
                keys["arrowright"]
            ) {
                moveX += 1;
            }

            if (
                keys["w"] ||
                keys["arrowup"]
            ) {
                moveZ -= 1;
            }

            if (
                keys["s"] ||
                keys["arrowdown"]
            ) {
                moveZ += 1;
            }


            /* JOYSTICK */

            if (
                Math.abs(joystickX) > 0.05 ||
                Math.abs(joystickY) > 0.05
            ) {

                moveX = joystickX;

                moveZ = joystickY;
            }


            const magnitude =
                Math.sqrt(
                    moveX * moveX +
                    moveZ * moveZ
                );


            if (magnitude > 0.05) {

                moveX /= magnitude;
                moveZ /= magnitude;


                /* MOVE */

                player.position.x +=
                    moveX * moveSpeed;

                player.position.z +=
                    moveZ * moveSpeed;


                /* ROTATE CHARACTER */

                const targetRotation =
                    Math.atan2(
                        moveX,
                        moveZ
                    );


                let rotationDifference =
                    targetRotation -
                    player.rotation.y;


                rotationDifference =
                    Math.atan2(
                        Math.sin(rotationDifference),
                        Math.cos(rotationDifference)
                    );


                player.rotation.y +=
                    rotationDifference * 0.18;


                /* WALK ANIMATION */

                walkTime += 0.22;

                leftLeg.rotation.x =
                    Math.sin(walkTime) * 0.5;

                rightLeg.rotation.x =
                    Math.sin(walkTime + Math.PI) * 0.5;

                leftArm.rotation.x =
                    Math.sin(walkTime + Math.PI) * 0.35;

                rightArm.rotation.x =
                    Math.sin(walkTime) * 0.35;

            } else {

                /* RETURN LIMBS */

                leftLeg.rotation.x *= 0.8;
                rightLeg.rotation.x *= 0.8;

                leftArm.rotation.x *= 0.8;
                rightArm.rotation.x *= 0.8;
            }


            /* =================================================
               JUMP / GRAVITY
            ================================================= */

            player.position.y +=
                verticalVelocity;

            verticalVelocity +=
                gravity;


            if (player.position.y <= 0) {

                player.position.y = 0;

                verticalVelocity = 0;

                isJumping = false;
            }


            /* =================================================
               WORLD BOUNDS
            ================================================= */

            player.position.x =
                THREE.MathUtils.clamp(
                    player.position.x,
                    -90,
                    90
                );

            player.position.z =
                THREE.MathUtils.clamp(
                    player.position.z,
                    -110,
                    110
                );
        }


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );


        /* =====================================================
           GAME LOOP
        ===================================================== */

        function animate() {

            requestAnimationFrame(
                animate
            );


            updatePlayer();

            updateCamera();


            renderer.render(
                scene,
                camera
            );
        }


        /* START GAME */

        animate();

    </script>

</body>
</html>
