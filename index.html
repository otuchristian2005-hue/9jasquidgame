<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>9jaSquidGame 🇳🇬</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }

        #ui h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        #ui p {
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div id="ui">
        <h1>🇳🇬 9jaSquidGame</h1>
        <p>Prototype v0.1</p>
    </div>

    <div id="game"></div>

    <!-- Three.js -->
    <script type="module">

        import * as THREE
        from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


        // =========================
        // SCENE
        // =========================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87ceeb);


        // =========================
        // CAMERA
        // =========================

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 6, 12);


        // =========================
        // RENDERER
        // =========================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        document
            .getElementById("game")
            .appendChild(renderer.domElement);


        // =========================
        // LIGHT
        // =========================

        const sunlight = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        sunlight.position.set(10, 20, 10);

        scene.add(sunlight);


        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            0.6
        );

        scene.add(ambientLight);


        // =========================
        // GROUND
        // =========================

        const groundGeometry =
            new THREE.PlaneGeometry(100, 100);

        const groundMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x3d7a3d
            });

        const ground =
            new THREE.Mesh(
                groundGeometry,
                groundMaterial
            );

        ground.rotation.x = -Math.PI / 2;

        scene.add(ground);


        // =========================
        // ROAD
        // =========================

        const roadGeometry =
            new THREE.BoxGeometry(12, 0.1, 60);

        const roadMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x333333
            });

        const road =
            new THREE.Mesh(
                roadGeometry,
                roadMaterial
            );

        road.position.y = 0.05;

        scene.add(road);


        // =========================
        // BUILDING
        // =========================

        const buildingGeometry =
            new THREE.BoxGeometry(10, 6, 5);

        const buildingMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xeeeeee
            });

        const building =
            new THREE.Mesh(
                buildingGeometry,
                buildingMaterial
            );

        building.position.set(0, 3, -12);

        scene.add(building);


        // =========================
        // ROOF
        // =========================

        const roofGeometry =
            new THREE.BoxGeometry(11, 0.5, 6);

        const roofMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x222222
            });

        const roof =
            new THREE.Mesh(
                roofGeometry,
                roofMaterial
            );

        roof.position.set(0, 6.25, -12);

        scene.add(roof);


        // =========================
        // BILLBOARD
        // =========================

        const billboardGeometry =
            new THREE.BoxGeometry(10, 4, 0.5);

        const billboardMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x111111
            });

        const billboard =
            new THREE.Mesh(
                billboardGeometry,
                billboardMaterial
            );

        billboard.position.set(0, 6, 2);

        scene.add(billboard);


        // =========================
        // RESIZE
        // =========================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // =========================
        // GAME LOOP
        // =========================

        function animate() {

            requestAnimationFrame(animate);

            renderer.render(
                scene,
                camera
            );

        }

        animate();

    </script>

</body>
</html>
