<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>9jaSquidGame</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- GAME HUD -->
    <div id="game-ui">

        <div id="game-logo">
            🇳🇬 9jaSquidGame
            <span>WORLD</span>
        </div>

        <div id="player-info">
            <div id="player-name">Player</div>
            <div id="player-state">Nigeria</div>
        </div>

    </div>


    <!-- MOBILE CONTROLS -->

    <div id="joystick">
        <div id="joystick-knob"></div>
    </div>

    <button id="jump-button">
        JUMP
    </button>


    <!-- MINI MAP -->

    <div id="mini-map">
        <div id="map-player"></div>
    </div>


    <!-- LOADING SCREEN -->

    <div id="loading-screen">

        <div class="loading-logo">
            🇳🇬
        </div>

        <h1>9jaSquidGame</h1>

        <p>Entering Nigeria...</p>

        <div class="loading-bar">
            <div id="loading-progress"></div>
        </div>

    </div>


    <!-- THREE.JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js">
    </script>


    <!-- GAME -->

    <script
        type="module"
        src="js/main.js">
    </script>

</body>

</html>
