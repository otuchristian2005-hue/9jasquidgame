<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>9jaSquidGame</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        /* =========================
           TOP UI
        ========================= */

        #ui {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;

            color: white;
            background: rgba(0, 0, 0, 0.65);

            padding: 14px 18px;
            border-radius: 14px;

            backdrop-filter: blur(8px);

            pointer-events: none;
        }

        #ui h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        #ui p {
            font-size: 13px;
            opacity: 0.8;
        }

        /* =========================
           JOYSTICK
        ========================= */

        #joystick {
            position: fixed;
            left: 28px;
            bottom: 35px;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.25);

            z-index: 20;
        }

        #stick {
            position: absolute;

            width: 58px;
            height: 58px;

            left: 34px;
            top: 34px;

            border-radius: 50%;

            background: rgba(255,255,255,0.7);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        /* =========================
           JUMP BUTTON
        ========================= */

        #jump {
            position: fixed;

            right: 30px;
            bottom: 45px;

            width: 75px;
            height: 75px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.3);

            background: rgba(255,255,255,0.15);

            color: white;

            font-size: 13px;
            font-weight: bold;

            z-index: 20;
        }

        #jump:active {
            background: rgba(255,255,255,0.35);
        }
    </style>
</head>

<body>

    <div id="ui">
        <h1>🇳🇬 9jaSquidGame</h1>
        <p>Prototype v0.2</p>
    </div>

    <div id="game"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="jump">JUMP</button>


    <script type="module">

        import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        // ==========================================
        // SCENE
        // ==========================================

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0x82c9e5);


        // ==========================================
        // CAMERA
        // ==========================================

        const camera =
            new THREE.PerspectiveCamera(
                65,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );


        // ==========================================
        // RENDERER
        // ==========================================

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.shadowMap.enabled = true;

        document
            .getElementById("game")
            .appendChild(renderer.domElement);


        // ==========================================
        // LIGHTING
        // ==========================================

        const sun =
            new THREE.DirectionalLight(
                0xffffff,
                2
            );

        sun.position.set(
            20,
            30,
            10
        );

        sun.castShadow = true;

        scene.add(sun);


        const ambient =
            new THREE.AmbientLight(
                0xffffff,
                0.6
            );

        scene.add(ambient);


        // ==========================================
        // GROUND
        // ==========================================

        const groundGeometry =
            new THREE.PlaneGeometry(
                150,
                150
            );

        const groundMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x39783f
            });

        const ground =
            new THREE.Mesh(
                groundGeometry,
                groundMaterial
            );

        ground.rotation.x =
            -Math.PI / 2;

        ground.receiveShadow = true;

        scene.add(ground);


        // ==========================================
        // ROAD
        // ==========================================

        const roadGeometry =
            new THREE.BoxGeometry(
                14,
                0.12,
                100
            );

        const roadMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x292929
            });

        const road =
            new THREE.Mesh(
                roadGeometry,
                roadMaterial
            );

        road.position.y = 0.06;

        scene.add(road);


        // ==========================================
        // ROAD LINES
        // ==========================================

        for (
            let z = -45;
            z < 45;
            z += 8
        ) {

            const lineGeometry =
                new THREE.BoxGeometry(
                    0.25,
                    0.03,
                    4
                );

            const lineMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xffffff
                });

            const line =
                new THREE.Mesh(
                    lineGeometry,
                    lineMaterial
                );

            line.position.set(
                0,
                0.14,
                z
            );

            scene.add(line);
        }


        // ==========================================
        // BUILDING
        // ==========================================

        const buildingGeometry =
            new THREE.BoxGeometry(
                10,
                6,
                6
            );

        const buildingMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xb7b7b7
            });

        const building =
            new THREE.Mesh(
                buildingGeometry,
                buildingMaterial
            );

        building.position.set(
            0,
            3,
            -18
        );

        building.castShadow = true;

        scene.add(building);


        // ==========================================
        // BUILDING ROOF
        // ==========================================

        const roofGeometry =
            new THREE.BoxGeometry(
                11,
                0.5,
                7
            );

        const roofMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x1c1c1c
            });

        const roof =
            new THREE.Mesh(
                roofGeometry,
                roofMaterial
            );

        roof.position.set(
            0,
            6.25,
            -18
        );

        scene.add(roof);


        // ==========================================
        // BILLBOARD
        // ==========================================

        const billboardGeometry =
            new THREE.BoxGeometry(
                12,
                5,
                0.5
            );

        const billboardMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x111111
            });

        const billboard =
            new THREE.Mesh(
                billboardGeometry,
                billboardMaterial
            );

        billboard.position.set(
            0,
            6,
            7
        );

        scene.add(billboard);


        // ==========================================
        // PLAYER
        // ==========================================

        const player =
            new THREE.Group();


        // Body

        const bodyGeometry =
            new THREE.BoxGeometry(
                1,
                1.5,
                0.6
            );

        const bodyMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x6c35d8
            });

        const body =
            new THREE.Mesh(
                bodyGeometry,
                bodyMaterial
            );

        body.position.y = 1.35;

        body.castShadow = true;

        player.add(body);


        // Head

        const headGeometry =
            new THREE.SphereGeometry(
                0.43,
                24,
                24
            );

        const headMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x8b5a3c
            });

        const head =
            new THREE.Mesh(
                headGeometry,
                headMaterial
            );

        head.position.y = 2.35;

        head.castShadow = true;

        player.add(head);


        // Legs

        const legGeometry =
            new THREE.BoxGeometry(
                0.3,
                1,
                0.35
            );

        const legMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x171717
            });


        const leftLeg =
            new THREE.Mesh(
                legGeometry,
                legMaterial
            );

        leftLeg.position.set(
            -0.25,
            0.5,
            0
        );

        player.add(leftLeg);


        const rightLeg =
            new THREE.Mesh(
                legGeometry,
                legMaterial
            );

        rightLeg.position.set(
            0.25,
            0.5,
            0
        );

        player.add(rightLeg);


        // Arms

        const armGeometry =
            new THREE.BoxGeometry(
                0.25,
                1.1,
                0.3
            );

        const armMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x8b5a3c
            });


        const leftArm =
            new THREE.Mesh(
                armGeometry,
                armMaterial
            );

        leftArm.position.set(
            -0.65,
            1.4,
            0
        );

        player.add(leftArm);


        const rightArm =
            new THREE.Mesh(
                armGeometry,
                armMaterial
            );

        rightArm.position.set(
            0.65,
            1.4,
            0
        );

        player.add(rightArm);


        // Player starting position

        player.position.set(
            0,
            0,
            10
        );

        scene.add(player);


        // ==========================================
        // CAMERA START
        // ==========================================

        camera.position.set(
            0,
            5,
            17
        );


        // ==========================================
        // PLAYER MOVEMENT
        // ==========================================

        let moveX = 0;
        let moveZ = 0;

        const speed = 0.12;


        function updatePlayer() {

            player.position.x +=
                moveX * speed;

            player.position.z +=
                moveZ * speed;


            // Keep player inside the world

            player.position.x =
                Math.max(
                    -25,
                    Math.min(
                        25,
                        player.position.x
                    )
                );

            player.position.z =
                Math.max(
                    -45,
                    Math.min(
                        45,
                        player.position.z
                    )
                );


            // Turn player toward movement

            if (
                Math.abs(moveX) > 0.05 ||
                Math.abs(moveZ) > 0.05
            ) {

                player.rotation.y =
                    Math.atan2(
                        moveX,
                        moveZ
                    );

            }
        }


        // ==========================================
        // CAMERA FOLLOW
        // ==========================================

        function updateCamera() {

            const targetX =
                player.position.x;

            const targetY =
                player.position.y + 3.8;

            const targetZ =
                player.position.z + 7;


            camera.position.x +=
                (targetX - camera.position.x)
                * 0.08;

            camera.position.y +=
                (targetY - camera.position.y)
                * 0.08;

            camera.position.z +=
                (targetZ - camera.position.z)
                * 0.08;


            camera.lookAt(
                player.position.x,
                player.position.y + 1.2,
                player.position.z
            );
        }


        // ==========================================
        // MOBILE JOYSTICK
        // ==========================================

        const joystick =
            document.getElementById(
                "joystick"
            );

        const stick =
            document.getElementById(
                "stick"
            );

        let joystickActive = false;

        let startX = 0;
        let startY = 0;


        joystick.addEventListener(
            "touchstart",
            (event) => {

                event.preventDefault();

                joystickActive = true;

                const touch =
                    event.touches[0];

                startX = touch.clientX;
                startY = touch.clientY;
            },
            { passive: false }
        );


        joystick.addEventListener(
            "touchmove",
            (event) => {

                if (!joystickActive) return;

                event.preventDefault();

                const touch =
                    event.touches[0];

                let dx =
                    touch.clientX - startX;

                let dy =
                    touch.clientY - startY;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                const maxDistance = 38;


                if (
                    distance >
                    maxDistance
                ) {

                    dx =
                        dx /
                        distance *
                        maxDistance;

                    dy =
                        dy /
                        distance *
                        maxDistance;
                }


                stick.style.transform =
                    `translate(${dx}px, ${dy}px)`;


                moveX =
                    dx / maxDistance;

                moveZ =
                    dy / maxDistance;

            },
            { passive: false }
        );


        joystick.addEventListener(
            "touchend",
            (event) => {

                joystickActive = false;

                stick.style.transform =
                    "translate(0px, 0px)";

                moveX = 0;
                moveZ = 0;
            }
        );


        // ==========================================
        // KEYBOARD CONTROLS
        // ==========================================

        const keys = {};


        window.addEventListener(
            "keydown",
            (event) => {

                keys[event.key.toLowerCase()] =
                    true;

                updateKeyboard();
            }
        );


        window.addEventListener(
            "keyup",
            (event) => {

                keys[event.key.toLowerCase()] =
                    false;

                updateKeyboard();
            }
        );


        function updateKeyboard() {

            let x = 0;
            let z = 0;


            if (keys["a"])
                x -= 1;

            if (keys["d"])
                x += 1;

            if (keys["w"])
                z -= 1;

            if (keys["s"])
                z += 1;


            moveX = x;
            moveZ = z;
        }


        // ==========================================
        // RESIZE
        // ==========================================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );


        // ==========================================
        // GAME LOOP
        // ==========================================

        function animate() {

            requestAnimationFrame(
                animate
            );

            updatePlayer();

            updateCamera();

            renderer.render(
                scene,
                camera
            );
        }


        animate();

    </script>

</body>
</html>
